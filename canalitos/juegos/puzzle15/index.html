<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
	<title>15 Puzzle</title>
	<!-- 15 Puzzle de Arnis Ritiņš (MIT, ver LICENSE), de github.com/arnisritins/15-Puzzle @ 47c82f1.
	     Para Canalitos: sin enlace a fuera, empieza desordenado, explicación y mensaje al ganar en vez de confirm(). -->
	<link rel="stylesheet" href="15-puzzle.css">
	<style>
		body { margin: 0; padding: 12px; background: #e9f5f5; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
		h1 { margin: 8px 0 0; font: 800 26px ui-rounded, system-ui, sans-serif; text-align: center; color: #003333; }
		p.como { font: 16px/1.4 ui-rounded, system-ui, sans-serif; color: #335; margin: 6px 0 0; }
		#puzzle { margin-top: 18px; }
		p#bien { font: 800 22px/1.3 ui-rounded, system-ui, sans-serif; color: #2f9e5b; margin-top: 10px; }
	</style>
</head>
<body>
	<h1>15 Puzzle</h1>
	<p class="como">Tap a number next to the gap to slide it. Put them in order: 1, 2, 3… 15!</p>
	<div id="puzzle"></div>
	<p id="bien" hidden>You did it! 🎉 Tap “Scramble” to play again.</p>
	<div id="controls">
		<button id="solve">Solve</button>
		<button id="scramble">Scramble</button>
	</div>

	<p>Developed by Arnis Ritiņš</p>

	<script src="15-puzzle.js"></script>
	<script>
		document.getElementById('scramble').addEventListener('click', function () { document.getElementById('bien').hidden = true; });
		document.getElementById('scramble').click();   // que empiece desordenado
	</script>
</body>
</html>
