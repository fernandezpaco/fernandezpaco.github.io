<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noughts and Crosses</title>
<style>
:root {
  --ink: #3a2e5c;
  --soft: #8a7fb0;
  --x: #ff5470;
  --o: #2d8cff;
  --sun: #ffd166;
  --sun-dark: #eeb03c;
  --purple: #7c4dff;
  --purple-dark: #5a2fd6;
  --green: #22c55e;
  --green-dark: #169c48;
  --orange: #ff8c42;
  --orange-dark: #e06a1c;
  --line: #e6dcff;
  --card: #ffffff;
  --gap: clamp(8px, 1.6vmin, 14px);
  --bgap: clamp(6px, 2vmin, 14px);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
  background:
    radial-gradient(circle at 12% 8%, #fff0cc 0, transparent 45%),
    radial-gradient(circle at 92% 92%, #d9f1ff 0, transparent 50%),
    #fbf5ff;
  color: var(--ink);
  font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible { outline: 4px solid var(--purple); outline-offset: 3px; }

/* Rejilla: en vertical todo en columna; en horizontal, tablero a la izquierda */
.app {
  height: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 10px 12px 12px;
  display: grid;
  gap: var(--gap);
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto auto minmax(0, 1fr) auto auto;
  grid-template-areas: "modes" "levels" "status" "board" "scores" "again";
}
@media (orientation: landscape) and (min-aspect-ratio: 5/4) {
  .app {
    grid-template-columns: minmax(0, 1fr) minmax(260px, 360px);
    grid-template-rows: auto auto minmax(0, 1fr) auto auto;
    grid-template-areas: "board modes" "board levels" "board status" "board scores" "board again";
    column-gap: clamp(12px, 3vw, 36px);
  }
}

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
#modes { grid-area: modes; }
#levels, .hint { grid-area: levels; }
.pill {
  min-height: 64px;
  padding: 0 8px;
  border: 3px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  box-shadow: 0 4px 0 var(--line);
  font-size: clamp(16px, 2.4vmin + 8px, 22px);
  font-weight: 800;
  white-space: nowrap;
  transition: transform .1s, background-color .2s, box-shadow .1s;
}
.pill:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.pill[aria-pressed="true"] { background: var(--purple); border-color: var(--purple); color: #fff; box-shadow: 0 4px 0 var(--purple-dark); }
.pill[data-level="easy"][aria-pressed="true"] { background: var(--green); border-color: var(--green); box-shadow: 0 4px 0 var(--green-dark); }
.pill[data-level="hard"][aria-pressed="true"] { background: var(--orange); border-color: var(--orange); box-shadow: 0 4px 0 var(--orange-dark); }

.hint {
  display: none;
  margin: 0;
  min-height: 64px;
  align-items: center;
  justify-content: center;
  color: var(--soft);
  font-size: clamp(18px, 2.4vmin + 10px, 26px);
  font-weight: 800;
}
body[data-mode="two"] #levels { display: none; }
body[data-mode="two"] .hint { display: flex; }

.status {
  grid-area: status;
  margin: 0;
  min-height: 1.5em;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: clamp(22px, 3vmin + 12px, 38px);
  font-weight: 900;
  line-height: 1.1;
}
.msg { display: inline-flex; align-items: center; gap: .3em; animation: fade .25s ease-out both; }
.msg.big { color: var(--purple); animation: hop .6s cubic-bezier(.34, 1.56, .64, 1) both; }
.msg .mark { width: 1.1em; height: 1.1em; stroke-width: 16; }
.dots i { font-style: normal; animation: blink 1s infinite both; }
.dots i:nth-child(2) { animation-delay: .2s; }
.dots i:nth-child(3) { animation-delay: .4s; }

/* Tablero cuadrado que cabe en el hueco que quede (container queries) */
.board-wrap {
  grid-area: board;
  min-width: 0;
  min-height: 0;
  display: grid;
  place-items: center;
  container-type: size;
}
.board {
  position: relative;
  width: min(92vw, calc(100vh - 370px));
  aspect-ratio: 1;
  display: grid;
  grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  gap: var(--bgap);
  padding: var(--bgap);
  background: var(--sun);
  border-radius: clamp(18px, 4vmin, 32px);
  box-shadow: 0 8px 0 var(--sun-dark), 0 18px 40px rgba(160, 110, 20, .18);
}
@media (orientation: landscape) and (min-aspect-ratio: 5/4) {
  .board { width: min(55vw, calc(100vh - 40px)); }
}
@supports (width: 1cqmin) {
  .board { width: min(100cqmin - 12px, 720px); }
}
.cell {
  min-width: 0;
  min-height: 0;
  padding: 13%;
  border: 0;
  border-radius: clamp(12px, 3vmin, 22px);
  background: var(--card);
  box-shadow: 0 5px 0 #f1c25f;
  display: grid;
  place-items: center;
  transition: transform .1s, background-color .2s, opacity .3s;
}
.cell:active:not(.filled) { transform: translateY(3px); box-shadow: 0 2px 0 #f1c25f; }
@media (hover: hover) {
  .board:not(.over):not(.wait) .cell:not(.filled):hover { background: #fff8e6; }
}
.board.over .cell, .board.wait .cell, .cell.filled { cursor: default; }
.board.has-win .cell:not(.win) { opacity: .45; }
.cell.win { background: #fff4b8; animation: bounce .7s ease-in-out .3s 2 both; }
.cell.nope { animation: shake .3s; }

.mark { width: 100%; height: 100%; display: block; fill: none; stroke-width: 14; stroke-linecap: round; overflow: visible; }
.mark.x { stroke: var(--x); }
.mark.o { stroke: var(--o); }
.cell .mark { animation: pop .4s cubic-bezier(.34, 1.56, .64, 1) both; }
.cell .mark line { stroke-dasharray: 70; stroke-dashoffset: 70; animation: draw .2s ease-out forwards; }
.cell .mark line + line { animation-delay: .14s; }
.cell .mark circle { stroke-dasharray: 165; stroke-dashoffset: 165; animation: draw .38s ease-out forwards; }

.strike { position: absolute; inset: var(--bgap); z-index: 2; pointer-events: none; }
.strike svg { width: 100%; height: 100%; display: block; overflow: visible; }
.strike line {
  stroke: var(--purple);
  stroke-width: 12;
  stroke-linecap: round;
  opacity: .85;
  stroke-dasharray: 380;
  stroke-dashoffset: 380;
  animation: draw .45s ease-out .15s forwards;
}

.scores { grid-area: scores; display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
.chip {
  padding: 6px 4px;
  border: 3px solid transparent;
  border-radius: 18px;
  background: var(--card);
  box-shadow: 0 4px 0 var(--line);
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 2px;
  transition: border-color .2s, transform .2s;
}
.chip .top { display: flex; align-items: center; gap: 5px; font-size: clamp(14px, 1.4vmin + 9px, 18px); font-weight: 800; }
.chip .top .mark { width: 1.1em; height: 1.1em; stroke-width: 18; }
.chip b { font-size: clamp(22px, 2.4vmin + 14px, 34px); line-height: 1; }
.chip.x.active { border-color: var(--x); transform: translateY(-2px); }
.chip.o.active { border-color: var(--o); transform: translateY(-2px); }
.bump { animation: bump .5s ease-out; }

.again {
  grid-area: again;
  min-height: 68px;
  border: 0;
  border-radius: 999px;
  background: var(--green);
  color: #fff;
  box-shadow: 0 6px 0 var(--green-dark);
  font-size: clamp(20px, 2.4vmin + 12px, 30px);
  font-weight: 900;
  transition: transform .1s, box-shadow .1s;
}
.again:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--green-dark); }
.again.ready { animation: glow 1.2s ease-in-out infinite; }

.confetti { position: fixed; inset: 0; z-index: 5; overflow: hidden; pointer-events: none; }
.confetti span { position: absolute; top: -12%; font-size: clamp(22px, 5vmin, 42px); animation: fall linear both; }

@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { from { transform: scale(.5) rotate(-12deg); } to { transform: none; } }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes hop { from { opacity: 0; transform: scale(.4); } 70% { opacity: 1; transform: scale(1.12); } to { transform: none; } }
@keyframes bounce { 0%, 100% { transform: none; } 40% { transform: translateY(-7%) scale(1.05); } }
@keyframes shake { 25%, 75% { transform: translateX(-6%); } 50% { transform: translateX(6%); } }
@keyframes bump { 40% { transform: scale(1.5); color: var(--purple); } }
@keyframes glow { 50% { box-shadow: 0 6px 0 var(--green-dark), 0 0 0 10px rgba(34, 197, 94, .28); } }
@keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
@keyframes fall { to { transform: translateY(120vh) rotate(var(--r)); } }

@media (max-height: 560px) {
  :root { --gap: 6px; }
  .app { padding: 8px 10px; }
  .chip { padding: 3px 4px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .cell .mark line, .cell .mark circle, .strike line { stroke-dashoffset: 0; }
}
</style>
</head>
<body data-mode="robot">
<main class="app">
  <div class="seg" id="modes" role="group" aria-label="Game mode">
    <button class="pill" type="button" data-mode="robot" aria-pressed="true">🤖 vs Robot</button>
    <button class="pill" type="button" data-mode="two" aria-pressed="false">👫 2 players</button>
  </div>
  <div class="seg" id="levels" role="group" aria-label="Robot level">
    <button class="pill" type="button" data-level="easy" aria-pressed="true">😊 Easy</button>
    <button class="pill" type="button" data-level="hard" aria-pressed="false">💪 Hard</button>
  </div>
  <p class="hint">Take turns! 🙂</p>
  <p class="status" id="status" aria-live="polite"></p>
  <div class="board-wrap">
    <div class="board" id="board" role="group" aria-label="Board">
      <div class="strike" id="strike"></div>
    </div>
  </div>
  <div class="scores">
    <div class="chip x" id="chipX"><span class="top"><span id="icoX"></span><span id="lblX">You</span></span><b id="scX">0</b></div>
    <div class="chip d" id="chipD"><span class="top">🤝 <span>Draw</span></span><b id="scD">0</b></div>
    <div class="chip o" id="chipO"><span class="top"><span id="icoO"></span><span id="lblO">Robot</span></span><b id="scO">0</b></div>
  </div>
  <button class="again" id="again" type="button">🔄 Play again</button>
</main>
<script>
'use strict';

// Las 8 rayas posibles (casillas 0..8 por filas)
const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
const ROBOT_DELAY = 600; // ms que el robot "piensa"

const $ = (id) => document.getElementById(id);
const boardEl = $('board');
const statusEl = $('status');
const strikeEl = $('strike');
const againEl = $('again');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

const state = {
  mode: 'robot', // 'robot' | 'two'
  level: 'easy', // 'easy' | 'hard'
  cells: Array(9).fill(''),
  turn: 'X',
  starter: 'X',
  over: false,
  thinking: false,
  round: 0, // cambia en cada partida y anula la jugada pendiente del robot
  // Marcador de la sesión, uno por modo; solo en memoria (el marco no deja guardar)
  scores: { robot: { X: 0, O: 0, D: 0 }, two: { X: 0, O: 0, D: 0 } },
};
let cellEls = [];

function markSVG(mark) {
  if (mark === 'X') {
    return '<svg class="mark x" viewBox="0 0 100 100" aria-hidden="true">' +
      '<line x1="26" y1="26" x2="74" y2="74"/><line x1="74" y1="26" x2="26" y2="74"/></svg>';
  }
  return '<svg class="mark o" viewBox="0 0 100 100" aria-hidden="true">' +
    '<circle cx="50" cy="50" r="26" transform="rotate(-90 50 50)"/></svg>';
}

// Sonido: el AudioContext nace con el primer toque, que es lo que piden los navegadores
let audio = null;

function unlockAudio() {
  try {
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audio = new AC();
    }
    if (audio && audio.state === 'suspended') audio.resume();
  } catch (e) {
    audio = null;
  }
}

function tone(freq, at, dur, type = 'triangle', vol = 0.16, to = freq) {
  if (!audio) return;
  const t = audio.currentTime + at;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  osc.frequency.exponentialRampToValueAtTime(to, t + dur);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur + 0.05);
}

const SOUNDS = {
  X: () => tone(600, 0, 0.16, 'triangle', 0.18, 900),
  O: () => tone(520, 0, 0.16, 'triangle', 0.18, 360),
  tap: () => tone(760, 0, 0.08, 'sine', 0.12),
  nope: () => tone(200, 0, 0.14, 'square', 0.05, 160),
  win: () => [523, 659, 784, 1047].forEach((f, k) => tone(f, 0.15 + k * 0.11, 0.3)),
  robot: () => [392, 330, 262].forEach((f, k) => tone(f, 0.15 + k * 0.15, 0.2, 'square', 0.06)),
  draw: () => [587, 523].forEach((f, k) => tone(f, 0.15 + k * 0.18, 0.22)),
};

function sound(name) {
  try {
    SOUNDS[name]();
  } catch (e) {
    // sin sonido el juego sigue igual
  }
}

const other = (mark) => (mark === 'X' ? 'O' : 'X');
const empties = (c) => c.flatMap((v, i) => (v ? [] : [i]));
const pickRandom = (list) => list[Math.floor(Math.random() * list.length)];

function findWinner(c) {
  for (const line of LINES) {
    const [a, b, d] = line;
    if (c[a] && c[a] === c[b] && c[a] === c[d]) return { who: c[a], line };
  }
  return null;
}

// Casilla con la que `mark` gana en esta jugada, o -1
function winningMove(cells, mark) {
  const c = cells.slice();
  for (const i of empties(c)) {
    c[i] = mark;
    const won = findWinner(c);
    c[i] = '';
    if (won) return i;
  }
  return -1;
}

// Fácil: si puede ganar ya, gana; si no, juega al azar
function easyMove(cells) {
  const win = winningMove(cells, 'O');
  return win >= 0 ? win : pickRandom(empties(cells));
}

// Difícil: minimax completo, así que bloquea y nunca pierde. Puntúa desde el lado de O
function minimax(c, turn, depth) {
  const won = findWinner(c);
  if (won) return won.who === 'O' ? 10 - depth : depth - 10;
  const free = empties(c);
  if (!free.length) return 0;
  let best = turn === 'O' ? -Infinity : Infinity;
  for (const i of free) {
    c[i] = turn;
    const score = minimax(c, other(turn), depth + 1);
    c[i] = '';
    best = turn === 'O' ? Math.max(best, score) : Math.min(best, score);
  }
  return best;
}

// Entre jugadas igual de buenas elige al azar, para que no juegue siempre igual
function hardMove(cells) {
  const c = cells.slice();
  let best = -Infinity;
  let picks = [];
  for (const i of empties(c)) {
    c[i] = 'O';
    const score = minimax(c, 'X', 1);
    c[i] = '';
    if (score > best) {
      best = score;
      picks = [i];
    } else if (score === best) {
      picks.push(i);
    }
  }
  return pickRandom(picks);
}

function cellLabel(i) {
  return `Row ${Math.floor(i / 3) + 1}, column ${(i % 3) + 1}: ${state.cells[i] || 'empty'}`;
}

function setStatus(html, big) {
  statusEl.innerHTML = `<span class="msg${big ? ' big' : ''}">${html}</span>`;
}

function showTurn() {
  let html;
  if (state.thinking) html = '🤖 Robot is thinking<span class="dots"><i>.</i><i>.</i><i>.</i></span>';
  else if (state.mode === 'robot') html = `${markSVG('X')} Your turn!`;
  else html = `${markSVG(state.turn)} ${state.turn}'s turn!`;
  setStatus(html, false);
  $('chipX').classList.toggle('active', state.turn === 'X');
  $('chipO').classList.toggle('active', state.turn === 'O');
  boardEl.classList.toggle('wait', state.thinking);
}

function renderScores() {
  const s = state.scores[state.mode];
  const robot = state.mode === 'robot';
  $('lblX').textContent = robot ? 'You' : 'X';
  $('lblO').textContent = robot ? 'Robot' : 'O';
  $('scX').textContent = s.X;
  $('scO').textContent = s.O;
  $('scD').textContent = s.D;
}

function restartAnim(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth; // fuerza a que la animación vuelva a empezar
  el.classList.add(cls);
}

function onCell(i) {
  if (state.over || state.thinking) return;
  if (state.mode === 'robot' && state.turn !== 'X') return;
  if (state.cells[i]) {
    restartAnim(cellEls[i], 'nope');
    sound('nope');
    return;
  }
  place(i, state.turn);
}

function place(i, mark) {
  state.cells[i] = mark;
  const el = cellEls[i];
  el.innerHTML = markSVG(mark);
  el.classList.add('filled');
  el.setAttribute('aria-label', cellLabel(i));
  sound(mark);

  const won = findWinner(state.cells);
  if (won) return endGame(won.who, won.line);
  if (state.cells.every(Boolean)) return endGame('D', null);

  state.turn = other(mark);
  if (state.mode === 'robot' && state.turn === 'O') robotTurn();
  else showTurn();
}

function robotTurn() {
  state.thinking = true;
  showTurn();
  const round = state.round;
  setTimeout(() => {
    if (round !== state.round) return; // ya empezó otra partida
    state.thinking = false;
    place(state.level === 'hard' ? hardMove(state.cells) : easyMove(state.cells), 'O');
  }, ROBOT_DELAY);
}

function resultText(who) {
  if (who === 'D') return '🤝 Draw!';
  if (state.mode === 'robot') return who === 'X' ? '🎉 You win!' : '🤖 Robot wins!';
  return `🎉 ${who} wins!`;
}

function endGame(who, line) {
  state.over = true;
  state.scores[state.mode][who] += 1;
  renderScores();
  restartAnim($('sc' + who), 'bump');
  $('chipX').classList.remove('active');
  $('chipO').classList.remove('active');
  boardEl.classList.remove('wait');
  boardEl.classList.add('over');
  if (line) showWinLine(line);
  setStatus(resultText(who), true);
  againEl.classList.add('ready');
  // En 2 jugadores empieza la siguiente el otro
  if (state.mode === 'two') state.starter = other(state.starter);

  const robotWon = state.mode === 'robot' && who === 'O';
  if (who === 'D') sound('draw');
  else if (robotWon) sound('robot');
  else {
    sound('win');
    confetti();
  }
}

function showWinLine(line) {
  line.forEach((i) => cellEls[i].classList.add('win'));
  boardEl.classList.add('has-win');
  // Centros de casilla en un lienzo de 300x300; la raya sobresale un poco por cada punta
  const at = (i) => [50 + (i % 3) * 100, 50 + Math.floor(i / 3) * 100];
  const [a, b] = [at(line[0]), at(line[2])];
  const dx = Math.sign(b[0] - a[0]) * 28;
  const dy = Math.sign(b[1] - a[1]) * 28;
  strikeEl.innerHTML = '<svg viewBox="0 0 300 300" aria-hidden="true">' +
    `<line x1="${a[0] - dx}" y1="${a[1] - dy}" x2="${b[0] + dx}" y2="${b[1] + dy}"/></svg>`;
}

function confetti() {
  if (reduceMotion.matches) return;
  const bits = ['🎉', '⭐', '🎈', '✨', '🌟', '🍭'];
  let html = '';
  for (let k = 0; k < 18; k++) {
    const left = Math.random() * 100;
    const dur = 0.9 + Math.random() * 0.9;
    const delay = Math.random() * 0.25;
    const spin = Math.round(Math.random() * 360 - 180);
    html += `<span style="left:${left}%;--r:${spin}deg;animation-duration:${dur}s;animation-delay:${delay}s">` +
      `${bits[k % bits.length]}</span>`;
  }
  const layer = document.createElement('div');
  layer.className = 'confetti';
  layer.innerHTML = html;
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 2300);
}

function newGame() {
  state.round += 1;
  state.cells.fill('');
  state.over = false;
  state.thinking = false;
  state.turn = state.mode === 'robot' ? 'X' : state.starter;
  cellEls.forEach((el, i) => {
    el.innerHTML = '';
    el.className = 'cell';
    el.setAttribute('aria-label', cellLabel(i));
  });
  boardEl.classList.remove('over', 'has-win', 'wait');
  strikeEl.innerHTML = '';
  againEl.classList.remove('ready');
  showTurn();
}

function pressOne(groupId, key, value) {
  $(groupId).querySelectorAll('button').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset[key] === value));
  });
}

function setMode(mode) {
  if (!mode || mode === state.mode) return;
  state.mode = mode;
  state.starter = 'X';
  document.body.dataset.mode = mode;
  pressOne('modes', 'mode', mode);
  sound('tap');
  renderScores();
  newGame();
}

function setLevel(level) {
  if (!level || level === state.level) return;
  state.level = level;
  pressOne('levels', 'level', level);
  sound('tap');
  newGame();
}

function init() {
  const cellsHtml = Array.from({ length: 9 }, (_, i) => `<button class="cell" type="button" data-i="${i}"></button>`);
  boardEl.insertAdjacentHTML('afterbegin', cellsHtml.join(''));
  cellEls = [...boardEl.querySelectorAll('.cell')];
  $('icoX').innerHTML = markSVG('X');
  $('icoO').innerHTML = markSVG('O');

  // En captura, para que el audio quede desbloqueado antes del sonido de la jugada
  ['pointerup', 'touchend', 'click', 'keydown'].forEach((type) => {
    document.addEventListener(type, unlockAudio, true);
  });
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  boardEl.addEventListener('click', (e) => {
    const cell = e.target.closest('.cell');
    if (cell) onCell(Number(cell.dataset.i));
  });
  $('modes').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) setMode(b.dataset.mode);
  });
  $('levels').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) setLevel(b.dataset.level);
  });
  againEl.addEventListener('click', () => {
    sound('tap');
    newGame();
  });

  renderScores();
  newGame();
}

init();
</script>
</body>
</html>
