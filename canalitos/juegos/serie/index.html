<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copy the Colours</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  body {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 12px 12px;
    font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #2b2350;
    background: linear-gradient(160deg, #fff4d6 0%, #ffe3ec 45%, #dcefff 100%);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { touch-action: manipulation; }
  button:focus-visible { outline: 4px solid #2b2350; outline-offset: 3px; }

  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 12px; }
  h1 { margin: 0; width: 100%; text-align: center; font-size: clamp(1.25rem, 4.5vw, 1.9rem); font-weight: 800; }
  .hud { display: flex; gap: 8px; }
  .pill {
    background: #fff;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: clamp(1rem, 3.8vw, 1.25rem);
    font-weight: 700;
    box-shadow: 0 2px 0 rgba(43, 35, 80, .12);
    white-space: nowrap;
  }
  .pill b { color: #e2366f; font-variant-numeric: tabular-nums; }
  @media (min-width: 700px) {
    .top { justify-content: space-between; }
    h1 { width: auto; }
  }

  .msg {
    margin: 0;
    min-height: 1.4em;
    line-height: 1.4;
    text-align: center;
    font-size: clamp(1.15rem, 4.8vw, 1.6rem);
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stage {
    flex: 1;
    min-height: 0;
    position: relative;
    display: grid;
    place-items: center;
    container-type: size;
  }
  .board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 12px;
    gap: clamp(10px, 3cqmin, 22px);
    width: 100%;
    height: 100%;
    /* llena el hueco, pero sin estirar las teclas más de 1,4 : 1 */
    width: min(100cqw, 140cqh);
    height: min(100cqh, 140cqw);
  }

  .pad {
    --c: #999;
    --d: #666;
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    margin: 0;
    padding: 0;
    min-width: 0;
    min-height: 0;
    font: inherit;
    color: inherit;
    border-radius: 28px;
    background: var(--c);
    box-shadow: inset 0 -10px 0 var(--d), 0 4px 10px rgba(43, 35, 80, .18);
    opacity: .7;
    filter: saturate(.8);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform .09s ease-out, opacity .09s, filter .09s, box-shadow .09s;
  }
  .pad.on {
    opacity: 1;
    filter: saturate(1.2) brightness(1.12);
    transform: scale(1.04);
    box-shadow: inset 0 0 0 6px rgba(255, 255, 255, .9), 0 0 34px 10px var(--c);
  }
  .pad.hint {
    outline: 6px solid #2b2350;
    outline-offset: 4px;
    animation: nudge .45s ease-in-out infinite alternate;
  }
  @keyframes nudge { to { outline-offset: 10px; } }

  .red    { --c: #ff4d5e; --d: #c9283a; border-top-left-radius: 70px; }
  .blue   { --c: #3b82f6; --d: #1d4fbf; border-top-right-radius: 70px; }
  .yellow { --c: #ffc928; --d: #d29a00; border-bottom-left-radius: 70px; }
  .green  { --c: #2ec27e; --d: #158a52; border-bottom-right-radius: 70px; }

  .badge {
    display: grid;
    place-items: center;
    width: 72px;
    width: clamp(56px, 20cqmin, 150px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: rgba(255, 255, 255, .88);
    box-shadow: 0 3px 0 rgba(0, 0, 0, .12);
    font-size: 44px;
    font-size: clamp(34px, 12cqmin, 96px);
    line-height: 1;
    pointer-events: none;
  }

  .party { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; pointer-events: none; }
  .burst {
    background: #fff;
    border-radius: 28px;
    padding: 18px 30px;
    text-align: center;
    font-weight: 800;
    box-shadow: 0 10px 30px rgba(43, 35, 80, .25);
    animation: pop .5s cubic-bezier(.2, 1.6, .4, 1);
  }
  .burst .big { font-size: clamp(2.5rem, 12vw, 4.5rem); line-height: 1.1; }
  .burst .word { font-size: clamp(1.6rem, 7vw, 2.6rem); color: #e2366f; }
  .burst .lv { font-size: clamp(1.1rem, 4.5vw, 1.5rem); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .confetti { position: fixed; inset: 0; z-index: 6; overflow: hidden; pointer-events: none; }
  .confetti span { position: absolute; top: -12%; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(125vh) rotate(540deg); } }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    padding: 16px;
    background: rgba(43, 35, 80, .45);
  }
  .card {
    width: min(420px, 100%);
    max-height: 100%;
    overflow: auto;
    background: #fff;
    border-radius: 28px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 14px 40px rgba(43, 35, 80, .35);
  }
  .friends { font-size: 2.4rem; letter-spacing: .15em; }
  .card h2 { margin: 6px 0 4px; font-size: 1.8rem; }
  .card p { margin: 6px 0; font-size: 1.2rem; line-height: 1.35; }
  .card .extra { min-height: 1.35em; font-weight: 800; color: #e2366f; }
  .speed { display: flex; justify-content: center; gap: 10px; margin: 14px 0; }
  .speed button {
    flex: 1;
    max-width: 160px;
    padding: 12px 10px;
    border: 3px solid #d9d3f0;
    border-radius: 18px;
    background: #f6f3ff;
    color: #2b2350;
    font: inherit;
    font-size: 1.2rem;
    font-weight: 800;
    cursor: pointer;
  }
  .speed button[aria-pressed="true"] { border-color: #7b5cff; background: #7b5cff; color: #fff; }
  .play {
    width: 100%;
    padding: 16px;
    border: 0;
    border-radius: 22px;
    background: #2ec27e;
    color: #fff;
    font: inherit;
    font-size: 1.6rem;
    font-weight: 800;
    box-shadow: inset 0 -6px 0 #158a52;
    cursor: pointer;
  }
  .play:active { transform: translateY(2px); }

  @media (prefers-reduced-motion: reduce) {
    .pad { transition: opacity .09s, filter .09s, box-shadow .09s; }
    .pad.on, .play:active { transform: none; }
    .pad.hint, .burst { animation: none; }
    .confetti { display: none; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>Copy the Colours</h1>
  <div class="hud">
    <span class="pill">Level <b id="level">1</b></span>
    <span class="pill">🏆 Best <b id="best">0</b></span>
    <span class="pill" id="speedPill" aria-label="Speed: slow">🐢</span>
  </div>
</header>

<p class="msg" id="msg" aria-live="polite">Ready?</p>

<main class="stage">
  <div class="board">
    <button type="button" class="pad red" data-i="0" aria-label="Red ladybug"><span class="badge">🐞</span></button>
    <button type="button" class="pad blue" data-i="1" aria-label="Blue whale"><span class="badge">🐳</span></button>
    <button type="button" class="pad yellow" data-i="2" aria-label="Yellow chick"><span class="badge">🐥</span></button>
    <button type="button" class="pad green" data-i="3" aria-label="Green frog"><span class="badge">🐸</span></button>
  </div>
  <div class="party" id="party" hidden>
    <div class="burst">
      <div class="big" aria-hidden="true">🎉</div>
      <div class="word" id="partyWord">Super!</div>
      <div class="lv" id="partyLevel">Level 5!</div>
    </div>
  </div>
</main>

<div class="confetti" id="confetti" aria-hidden="true"></div>

<div class="overlay" id="overlay">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <div class="friends" aria-hidden="true">🐞🐳🐥🐸</div>
    <h2 id="cardTitle">Copy the Colours</h2>
    <p id="cardText">Watch the colours. Then copy them!</p>
    <p class="extra" id="cardExtra"></p>
    <div class="speed" role="group" aria-label="Speed">
      <button type="button" data-speed="slow" aria-pressed="true">🐢 Slow</button>
      <button type="button" data-speed="fast" aria-pressed="false">🐇 Fast</button>
    </div>
    <button type="button" class="play" id="play">▶ Start</button>
  </div>
</div>

<script>
'use strict';

const NOTES = [261.63, 329.63, 392.0, 523.25]; // do, mi, sol, do agudo
const SPEEDS = {
  slow: { on: 650, gap: 280, tap: 320, icon: '🐢' },
  fast: { on: 380, gap: 130, tap: 220, icon: '🐇' },
};
const PRAISE = ['Great! ⭐', 'Yes! 👍', 'Good job! 😀', 'Super! ✨'];
const CHEERS = ['Super!', 'Amazing!', 'Wow!', 'Fantastic!'];
const PARTY = ['🎉', '⭐', '🌟', '🎈', '✨', '🍭'];

const $ = id => document.getElementById(id);
const pads = Array.from(document.querySelectorAll('.pad'));
const speedButtons = Array.from(document.querySelectorAll('[data-speed]'));
const ui = {
  level: $('level'), best: $('best'), speed: $('speedPill'), msg: $('msg'),
  overlay: $('overlay'), title: $('cardTitle'), text: $('cardText'), extra: $('cardExtra'), play: $('play'),
  party: $('party'), partyWord: $('partyWord'), partyLevel: $('partyLevel'), confetti: $('confetti'),
};
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

let audio = null;
let speed = 'slow';
let seq = [];
let step = 0;
let best = 0;
let bestAtStart = 0;
let state = 'idle'; // idle | show | input | wait
let gen = 0; // sube en cada partida: las esperas de la anterior se cortan solas
const tapTimers = [];

const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const pick = list => list[Math.floor(Math.random() * list.length)];
const sp = () => SPEEDS[speed];

// --- Sonido (si no hay audio, el juego sigue solo con luces) ---

function initAudio() {
  try {
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audio = new AC();
    }
    if (audio && audio.state === 'suspended') audio.resume().catch(() => {});
  } catch (e) {
    audio = null;
  }
}

function tone(freq, ms, delay = 0, type = 'triangle', vol = 0.22) {
  if (!audio) return;
  try {
    const t = audio.currentTime + delay;
    const end = t + ms / 1000;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    gain.gain.setValueAtTime(vol, Math.max(t + 0.03, end - 0.08));
    gain.gain.exponentialRampToValueAtTime(0.0001, end);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start(t);
    osc.stop(end + 0.05);
  } catch (e) { /* sin sonido */ }
}

function oopsSound() {
  tone(330, 180, 0, 'sine');
  tone(247, 320, 0.19, 'sine');
}

function cheerSound() {
  [523.25, 659.25, 783.99].forEach((f, k) => tone(f, 150, k * 0.12));
  tone(1046.5, 420, 0.36);
}

// --- Pantalla ---

function hud() {
  ui.level.textContent = Math.max(1, seq.length);
  ui.best.textContent = best;
}

function say(text) {
  ui.msg.textContent = text;
}

function setSpeed(name) {
  speed = name;
  speedButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.speed === name)));
  ui.speed.textContent = sp().icon;
  ui.speed.setAttribute('aria-label', 'Speed: ' + name);
}

function clearPads() {
  pads.forEach((p, i) => {
    clearTimeout(tapTimers[i]);
    p.classList.remove('on', 'hint');
  });
}

async function flash(i, ms) {
  tone(NOTES[i], ms);
  pads[i].classList.add('on');
  await wait(ms);
  pads[i].classList.remove('on');
}

function tapFlash(i) {
  const ms = sp().tap;
  tone(NOTES[i], ms);
  pads[i].classList.add('on');
  clearTimeout(tapTimers[i]);
  tapTimers[i] = setTimeout(() => pads[i].classList.remove('on'), ms);
}

function confetti() {
  const box = ui.confetti;
  box.textContent = '';
  for (let k = 0; k < 26; k++) {
    const s = document.createElement('span');
    s.textContent = pick(PARTY);
    s.style.left = Math.random() * 96 + '%';
    s.style.fontSize = 22 + Math.random() * 22 + 'px';
    s.style.animationDuration = 1.3 + Math.random() * 0.9 + 's';
    s.style.animationDelay = Math.random() * 0.4 + 's';
    box.appendChild(s);
  }
  setTimeout(() => { box.textContent = ''; }, 2800);
}

// --- Partida ---

function randPad() {
  // nunca tres iguales seguidos: a los peques les confunde
  const n = seq.length;
  let i;
  do {
    i = Math.floor(Math.random() * 4);
  } while (n >= 2 && seq[n - 1] === i && seq[n - 2] === i);
  return i;
}

function start() {
  initAudio();
  gen++;
  seq = [];
  step = 0;
  bestAtStart = best;
  clearPads();
  ui.party.hidden = true;
  ui.confetti.textContent = '';
  ui.overlay.hidden = true;
  nextRound();
}

async function nextRound() {
  const my = gen;
  seq.push(randPad());
  hud();
  state = 'show';
  say('Watch! 👀');
  await wait(700);
  for (const i of seq) {
    if (my !== gen) return;
    await flash(i, sp().on);
    await wait(sp().gap);
  }
  if (my !== gen) return;
  step = 0;
  state = 'input';
  say('Your turn! 👆');
}

function onPad(e) {
  e.preventDefault();
  // un solo dedo y botón principal (el clic de teclado no trae isPrimary fiable)
  if (e.type === 'pointerdown' && (!e.isPrimary || e.button > 0)) return;
  initAudio();
  if (state !== 'input') return;
  const i = Number(e.currentTarget.dataset.i);
  tapFlash(i);
  if (i !== seq[step]) {
    miss(seq[step]);
    return;
  }
  step++;
  if (step === seq.length) roundDone();
}

async function roundDone() {
  const my = gen;
  const lvl = seq.length;
  state = 'wait';
  best = Math.max(best, lvl);
  hud();
  await wait(sp().tap + 150);
  if (my !== gen) return;
  if (lvl % 5 === 0) {
    await celebrate(lvl);
  } else {
    say(pick(PRAISE));
    await wait(700);
  }
  if (my !== gen) return;
  nextRound();
}

async function celebrate(lvl) {
  ui.partyWord.textContent = CHEERS[(lvl / 5 - 1) % CHEERS.length];
  ui.partyLevel.textContent = 'Level ' + lvl + '!';
  ui.party.hidden = false;
  say('🎉 🎉 🎉');
  cheerSound();
  if (!reduceMotion.matches) confetti();
  await wait(2000);
  ui.party.hidden = true;
}

async function miss(right) {
  const my = gen;
  state = 'wait';
  await wait(250);
  if (my !== gen) return;
  say('Oops! Try again');
  oopsSound();
  await wait(450);
  // enseña con calma cuál era la buena
  pads[right].classList.add('hint');
  for (let k = 0; k < 2; k++) {
    if (my !== gen) return;
    await flash(right, 450);
    await wait(220);
  }
  await wait(500);
  if (my !== gen) return;
  pads[right].classList.remove('hint');
  showEnd(seq.length - 1);
}

function showEnd(done) {
  state = 'idle';
  ui.title.textContent = done > 0 ? 'Well done!' : 'Good try!';
  ui.text.textContent = done > 0
    ? 'You did ' + done + (done === 1 ? ' level! ⭐' : ' levels! ⭐')
    : 'Watch the colours. Then copy them!';
  ui.extra.textContent = done > bestAtStart ? 'New best! 🏆' : 'Best: ' + best;
  ui.play.textContent = '▶ Play again';
  ui.overlay.hidden = false;
  ui.play.focus({ preventScroll: true });
}

// --- Eventos ---

pads.forEach(p => {
  p.addEventListener('pointerdown', onPad);
  p.addEventListener('click', e => { if (e.detail === 0) onPad(e); }); // Enter/Espacio con teclado
  p.addEventListener('contextmenu', e => e.preventDefault());
});
speedButtons.forEach(b => b.addEventListener('click', () => setSpeed(b.dataset.speed)));
ui.play.addEventListener('click', start);

setSpeed('slow');
hud();
</script>
</body>
</html>
